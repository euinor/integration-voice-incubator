# voice_timer_list's actions -- the entity platform this integration brings,
# which is not an integration of its own -- are described in code
# (timer_list.py, async_set_service_schema). These are voice_incubator's own:
# the same actions, on a timer sensor (sensor.py).

pause_timer:
  target: &timer_sensor
    entity:
      integration: voice_incubator
      domain: sensor

resume_timer:
  target: *timer_sensor

cancel_timer:
  target: *timer_sensor

add_time:
  target: *timer_sensor
  fields:
    duration: &duration
      required: true
      selector:
        duration:

subtract_time:
  target: *timer_sensor
  fields:
    duration: *duration
